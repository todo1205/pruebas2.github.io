<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ojos Expresivos</title>
  <style>
    :root {
      --bg: #030615;
      --blue1: #5fd2ff;
      --blue2: #2aa1ff;
      --blue3: #0d4b8a;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      color: #cfeffd;
      overflow: hidden;
    }
    canvas {
      width: min(88vw, 720px);
      height: auto;
      aspect-ratio: 4/3;
      background: linear-gradient(180deg, #021022, #021018);
      border: 3px solid rgba(45, 140, 255, .12);
      box-shadow: 0 8px 30px rgba(10, 40, 90, .6), inset 0 0 30px rgba(10, 40, 90, .25);
    }
    .hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      opacity: .9;
      color: var(--blue1);
    }
    .back-btn {
      position: fixed;
      top: 15px;
      left: 15px;
      color: var(--blue1);
      text-decoration: none;
      background: rgba(2, 16, 34, 0.8);
      border: 1px solid var(--blue3);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: var(--blue3);
      color: #fff;
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Menú</a>
  <canvas id="c" width="320" height="240"></canvas>
  <div class="hint">Expresiones en Bucle — Basado en Guía</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    const colors = { bg: '#030615', blue1: '#5fd2ff', blue2: '#2aa1ff', blue3: '#0d4b8a' };

    const eyeSpacing = 45; 
    const baseRadiusX = 14; 
    const baseRadiusY = 22;

    // Estado animado actual
    let current = {
      lx: W/2 - eyeSpacing, ly: H/2, rx: W/2 + eyeSpacing, ry: H/2,
      radLx: baseRadiusX, radLy: baseRadiusY,
      radRx: baseRadiusX, radRy: baseRadiusY,
      rotL: 0, rotR: 0,
      isArc: 0 // Interpolación de 0 (óvalo) a 1 (arco feliz)
    };

    // Expresiones exactas a la imagen
    const expressions = [
      {
        name: 'Normal',
        duration: 2000,
        target: {
          lx: W/2 - eyeSpacing, ly: H/2, rx: W/2 + eyeSpacing, ry: H/2,
          radLx: baseRadiusX, radLy: baseRadiusY,
          radRx: baseRadiusX, radRy: baseRadiusY,
          rotL: 0, rotR: 0, isArc: 0
        }
      },
      {
        name: 'FELIZ',
        duration: 2500,
        target: {
          lx: W/2 - eyeSpacing, ly: H/2 - 5, rx: W/2 + eyeSpacing, ry: H/2 - 5,
          radLx: 22, radLy: 16,
          radRx: 22, radRy: 16,
          rotL: 0, rotR: 0, isArc: 1
        }
      },
      {
        name: 'Pensativo',
        duration: 2500,
        target: {
          lx: W/2 - eyeSpacing + 8, ly: H/2 - 5, rx: W/2 + eyeSpacing + 8, ry: H/2 - 5,
          radLx: 10, radLy: 5,   // Ojo izquierdo más pequeño / entreabierto
          radRx: 16, radLy: 6,   // Ojo derecho achatado
          rotL: 0, rotR: 0, isArc: 0
        }
      },
      {
        name: 'TRISTE',
        duration: 2500,
        target: {
          lx: W/2 - eyeSpacing, ly: H/2 + 5, rx: W/2 + eyeSpacing, ry: H/2 + 5,
          radLx: 14, radLy: 24,
          radRx: 14, radRy: 24,
          rotL: -0.55, rotR: 0.55, isArc: 0 // Inclinación hacia afuera (/ \)
        }
      },
      {
        name: 'Enojado',
        duration: 2500,
        target: {
          lx: W/2 - eyeSpacing, ly: H/2, rx: W/2 + eyeSpacing, ry: H/2,
          radLx: 15, radLy: 26,
          radRx: 15, radRy: 26,
          rotL: 0.55, rotR: -0.55, isArc: 0 // Inclinación hacia adentro (\ /)
        }
      },
      {
        name: 'Mirando Alrededor',
        duration: 1500,
        target: {
          lx: W/2 - eyeSpacing - 18, ly: H/2, rx: W/2 + eyeSpacing - 18, ry: H/2,
          radLx: baseRadiusX, radLy: baseRadiusY,
          radRx: baseRadiusX, radRy: baseRadiusY,
          rotL: 0, rotR: 0, isArc: 0
        }
      }
    ];

    let currentExprIndex = 0;
    let lastSwitchTime = performance.now();

    function lerp(start, end, amt) {
      return (1 - amt) * start + amt * end;
    }

    // Dibuja la forma según sea óvalo o arco curvo
    function drawEyeShape(rx, ry, arcRatio) {
      ctx.beginPath();
      
      if (arcRatio > 0.5) {
        // Dibujar Arco Feliz
        ctx.arc(0, 5, rx, Math.PI * 1.15, Math.PI * 1.85, false);
        ctx.lineWidth = 10;
        ctx.strokeStyle = colors.blue2;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Brillo interior del arco
        ctx.beginPath();
        ctx.arc(0, 5, rx, Math.PI * 1.2, Math.PI * 1.8, false);
        ctx.lineWidth = 4;
        ctx.strokeStyle = colors.blue1;
        ctx.stroke();
      } else {
        // Dibujar Óvalo Estándar
        ctx.ellipse(0, 0, Math.max(1, rx), Math.max(1, ry), 0, 0, Math.PI * 2);
        ctx.fillStyle = colors.blue2;
        ctx.fill();

        // Borde / Sombra exterior
        ctx.lineWidth = 2;
        ctx.strokeStyle = colors.blue3;
        ctx.stroke();

        // Centro brillante
        ctx.beginPath();
        ctx.ellipse(0, 0, Math.max(1, rx - 4), Math.max(1, ry - 4), 0, 0, Math.PI * 2);
        ctx.fillStyle = colors.blue1;
        ctx.fill();
      }
    }

    function drawEye(x, y, rx, ry, rotation, arcRatio) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      drawEyeShape(rx, ry, arcRatio);
      ctx.restore();
    }

    function update(now) {
      const expr = expressions[currentExprIndex];

      if (now - lastSwitchTime > expr.duration) {
        currentExprIndex = (currentExprIndex + 1) % expressions.length;
        lastSwitchTime = now;
      }

      const speed = 0.08;
      const target = expressions[currentExprIndex].target;

      current.lx = lerp(current.lx, target.lx, speed);
      current.ly = lerp(current.ly, target.ly, speed);
      current.rx = lerp(current.rx, target.rx, speed);
      current.ry = lerp(current.ry, target.ry, speed);

      current.radLx = lerp(current.radLx, target.radLx, speed);
      current.radLy = lerp(current.radLy, target.radLy, speed);
      current.radRx = lerp(current.radRx, target.radRx, speed);
      current.radRy = lerp(current.radRy, target.radRy, speed);

      current.rotL = lerp(current.rotL, target.rotL, speed);
      current.rotR = lerp(current.rotR, target.rotR, speed);
      current.isArc = lerp(current.isArc, target.isArc, speed);
    }

    function render() {
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, W, H);

      drawEye(current.lx, current.ly, current.radLx, current.radLy, current.rotL, current.isArc);
      drawEye(current.rx, current.ry, current.radRx, current.radRy, current.rotR, current.isArc);
    }

    function loop(now) {
      update(now);
      render();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
