<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menú Principal — Proyectos</title>
  <style>
    :root {
      --bg: #030615;
      --blue1: #5fd2ff;
      --blue2: #2aa1ff;
      --blue3: #0d4b8a;
    }
    body {
      background-color: var(--bg);
      color: #cfeffd;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      color: var(--blue1);
      text-shadow: 0 0 15px rgba(95, 210, 255, 0.4);
      margin-bottom: 30px;
      font-size: 26px;
      text-align: center;
    }
    .menu-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: min(80vw, 360px);
    }
    .btn {
      background: linear-gradient(180deg, #021022, #021018);
      border: 2px solid var(--blue3);
      color: var(--blue1);
      padding: 16px 20px;
      font-size: 15px;
      font-family: monospace;
      text-decoration: none;
      text-align: center;
      border-radius: 6px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(10, 40, 90, 0.4);
      cursor: pointer;
    }
    .btn:hover {
      background: var(--blue3);
      color: #fff;
      border-color: var(--blue1);
      box-shadow: 0 0 20px rgba(95, 210, 255, 0.4);
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <h1>Selecciona un Modo</h1>

  <div class="menu-container">
    <a href="pong.html" class="btn">▶ Pong (Demo IA vs IA)</a>
    <a href="ojos.html" class="btn">▶ Ojos Neón Ovalados</a>
    <a href="ojos_anime.html" class="btn">▶ Ojos Anime Expresivos</a>
  </div>

</body>
</html>
